name: Deploy web example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install pinned Flutter SDK through FVM
        shell: bash
        run: |
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install 8ebfb2e491 --setup --skip-pub-get
          flutter_sdk=$(find "$HOME/fvm/versions" -maxdepth 1 -type d -name '8ebfb2e491*' -print -quit)
          test -x "$flutter_sdk/bin/flutter"
          test "$(git -C "$flutter_sdk" rev-parse HEAD)" = '8ebfb2e49104ba1f63ac9b52d6ce7a866aabd2d0'
          echo "$flutter_sdk/bin" >> "$GITHUB_PATH"
          "$flutter_sdk/bin/flutter" --version | grep -q 'revision 8ebfb2e491'
          "$flutter_sdk/bin/flutter" config --enable-native-assets --enable-dart-data-assets
      - run: flutter pub get
      - run: flutter test packages/scroll_world
      - run: flutter build web --release --no-wasm-dry-run --base-href /flutter_scroll_world/
        working-directory: example
      - run: flutter build web --release --no-wasm-dry-run --base-href /flutter_scroll_world/padlo/
        working-directory: examples/padlo_poc
      - name: Verify Padlo Pages export
        shell: bash
        run: |
          padlo="examples/padlo_poc/build/web"
          test -s "$padlo/index.html"
          grep -Fq '<base href="/flutter_scroll_world/padlo/">' "$padlo/index.html"
          test -s "$padlo/assets/assets/scene/padlo-pilot.glb"
          test -s "$padlo/assets/assets/brand/padlo-logo.png"
          test -s "$padlo/assets/packages/flutter_scene/build/shaderbundles/base.shaderbundle"
          glb_bytes=$(stat -c '%s' "$padlo/assets/assets/scene/padlo-pilot.glb")
          [[ "$glb_bytes" -le 12582912 ]] || { echo "Padlo GLB exceeds 12 MiB"; exit 1; }
          if find "$padlo" -type f \( -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mov' \) -print -quit | grep -q .; then
            echo "Padlo export unexpectedly contains video media"
            exit 1
          fi
      - name: Assemble both examples
        shell: bash
        run: |
          mkdir -p build/pages/padlo
          cp -a example/build/web/. build/pages/
          cp -a examples/padlo_poc/build/web/. build/pages/padlo/
          touch build/pages/.nojekyll
      - name: Publish assembled site to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$RUNNER_TEMP/flutter-scroll-world-pages"
          mkdir -p "$publish_dir"
          cp -a build/pages/. "$publish_dir/"
          cd "$publish_dir"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
      - name: Request branch Pages build
        id: pages_build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "Requested a Pages build from gh-pages."
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=One-time Pages setup required::In Settings > Pages, choose Deploy from a branch, gh-pages, /(root), then Save."
          fi
      - name: Probe demo media delivery
        if: steps.pages_build.outputs.requested == 'true'
        shell: bash
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/assets/assets/videos/nairobi-landscape.mp4"
          status=000
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Range: bytes=0-1023' "$url")
            [[ "$status" == "200" || "$status" == "206" ]] && break
            echo "Waiting for Pages media deployment (attempt $attempt/30, HTTP $status)..."
            sleep 10
          done
          if [[ "$status" != "200" && "$status" != "206" ]]; then
            echo "Unexpected media response: $status"
            exit 1
          fi
          echo "Media probe returned HTTP $status (206 confirms byte-range support)."
      - name: Probe Padlo app and GLB asset
        if: steps.pages_build.outputs.requested == 'true'
        shell: bash
        run: |
          root="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/padlo/"
          app_status=000
          for attempt in {1..30}; do
            app_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$root")
            [[ "$app_status" == "200" ]] && break
            echo "Waiting for Padlo Pages deployment (attempt $attempt/30, HTTP $app_status)..."
            sleep 10
          done
          glb_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "${root}assets/assets/scene/padlo-pilot.glb")
          shader_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "${root}assets/packages/flutter_scene/build/shaderbundles/base.shaderbundle")
          [[ "$app_status" == "200" ]] || { echo "Padlo app returned $app_status"; exit 1; }
          [[ "$glb_status" == "200" ]] || { echo "Padlo GLB returned $glb_status"; exit 1; }
          [[ "$shader_status" == "200" ]] || { echo "Padlo shader bundle returned $shader_status"; exit 1; }
