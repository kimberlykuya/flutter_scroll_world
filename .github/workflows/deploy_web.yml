name: Deploy web example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install pinned Flutter SDK through FVM
        shell: bash
        run: |
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install
          fvm flutter --version | grep -q 'revision 8ebfb2e491'
          fvm flutter config --enable-native-assets --enable-dart-data-assets
      - uses: actions/configure-pages@v6
      - run: fvm flutter pub get
      - run: fvm flutter test packages/scroll_world
      - run: fvm flutter build web --release --no-wasm-dry-run --base-href /flutter_scroll_world/
        working-directory: example
      - run: fvm flutter build web --release --no-wasm-dry-run --base-href /flutter_scroll_world/padlo/
        working-directory: examples/padlo_poc
      - name: Assemble both examples
        shell: bash
        run: |
          mkdir -p build/pages/padlo
          cp -a example/build/web/. build/pages/
          cp -a examples/padlo_poc/build/web/. build/pages/padlo/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Probe demo media delivery
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}assets/assets/videos/nairobi-landscape.mp4"
          status=$(curl --retry 5 --retry-delay 3 --silent --output /dev/null --write-out '%{http_code}' --header 'Range: bytes=0-1023' "$url")
          if [[ "$status" != "200" && "$status" != "206" ]]; then
            echo "Unexpected media response: $status"
            exit 1
          fi
          echo "Media probe returned HTTP $status (206 confirms byte-range support)."
      - name: Probe Padlo app and GLB asset
        shell: bash
        run: |
          root="${{ steps.deployment.outputs.page_url }}padlo/"
          app_status=$(curl --retry 5 --retry-delay 3 --silent --output /dev/null --write-out '%{http_code}' "$root")
          media_status=$(curl --retry 5 --retry-delay 3 --silent --output /dev/null --write-out '%{http_code}' "${root}assets/assets/scene/padlo-pilot.glb")
          [[ "$app_status" == "200" ]] || { echo "Padlo app returned $app_status"; exit 1; }
          [[ "$media_status" == "200" ]] || { echo "Padlo GLB returned $media_status"; exit 1; }
