name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stable-package-and-kenya:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Resolve stable package and Kenya workspaces independently
        shell: bash
        run: |
          dart tools/prepare_stable_ci.dart
          cat > example/pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            scroll_world:
              path: ../packages/scroll_world
          EOF
          (cd packages/scroll_world && flutter pub get)
          (cd example && flutter pub get)
      - run: dart format --output=none --set-exit-if-changed packages/scroll_world/lib packages/scroll_world/test example/lib example/test example/integration_test tools/generate_manifest.dart tools/prepare_stable_ci.dart
      - run: python -m py_compile tools/blender/generate_kenya_world.py tools/blender/generate_padlo_world.py
      - run: bash -n tools/render_3d_media.sh tools/render_padlo_media.sh tools/encode_video.sh
      - run: flutter analyze packages/scroll_world
      - run: flutter analyze example
      - run: flutter test packages/scroll_world --coverage
      - run: flutter test example/test
      - run: dart pub -C packages/scroll_world publish --dry-run
      - run: flutter build web --release
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example

  padlo-real-time-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install pinned Flutter master through FVM
        shell: bash
        run: |
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install 8ebfb2e491 --setup --skip-pub-get
          flutter_sdk=$(find "$HOME/fvm/versions" -maxdepth 1 -type d -name '8ebfb2e491*' -print -quit)
          test -x "$flutter_sdk/bin/flutter"
          test "$(git -C "$flutter_sdk" rev-parse HEAD)" = '8ebfb2e49104ba1f63ac9b52d6ce7a866aabd2d0'
          echo "$flutter_sdk/bin" >> "$GITHUB_PATH"
          "$flutter_sdk/bin/flutter" --version | grep -q 'revision 8ebfb2e491'
          "$flutter_sdk/bin/flutter" config --enable-native-assets --enable-dart-data-assets
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed examples/padlo_poc/lib examples/padlo_poc/test examples/padlo_poc/integration_test
      - run: flutter analyze examples/padlo_poc
      - run: flutter test examples/padlo_poc/test
      - run: flutter build web --release --no-wasm-dry-run --base-href /flutter_scroll_world/padlo/
        working-directory: examples/padlo_poc

  ios-package-and-kenya:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Resolve stable package and Kenya workspaces independently
        shell: bash
        run: |
          dart tools/prepare_stable_ci.dart
          cat > example/pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            scroll_world:
              path: ../packages/scroll_world
          EOF
          (cd packages/scroll_world && flutter pub get)
          (cd example && flutter pub get)
      - run: flutter build ios --release --no-codesign
        working-directory: example
