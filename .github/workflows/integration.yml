name: Integration tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Resolve stable Kenya workspace
        shell: bash
        run: |
          dart tools/prepare_stable_ci.dart
          cat > example/pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            scroll_world:
              path: ../packages/scroll_world
          EOF
          (cd packages/scroll_world && flutter pub get)
          (cd example && flutter pub get)
      - name: Start ChromeDriver
        run: chromedriver --port=4444 &
      - run: flutter drive --driver test_driver/integration_test.dart --target integration_test/scroll_world_test.dart -d chrome
        working-directory: example

  padlo-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install pinned Flutter master through FVM
        shell: bash
        run: |
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install 8ebfb2e491 --setup --skip-pub-get
          flutter_sdk=$(find "$HOME/fvm/versions" -maxdepth 1 -type d -name '8ebfb2e491*' -print -quit)
          test -x "$flutter_sdk/bin/flutter"
          test "$(git -C "$flutter_sdk" rev-parse HEAD)" = '8ebfb2e49104ba1f63ac9b52d6ce7a866aabd2d0'
          echo "$flutter_sdk/bin" >> "$GITHUB_PATH"
          "$flutter_sdk/bin/flutter" --version | grep -q 'revision 8ebfb2e491'
          "$flutter_sdk/bin/flutter" config --enable-native-assets --enable-dart-data-assets
      - run: flutter pub get
      - name: Start ChromeDriver
        run: chromedriver --port=4444 &
      - run: flutter drive --driver test_driver/integration_test.dart --target integration_test/padlo_flow_test.dart -d chrome
        working-directory: examples/padlo_poc

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Resolve stable Kenya workspace
        shell: bash
        run: |
          dart tools/prepare_stable_ci.dart
          cat > example/pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            scroll_world:
              path: ../packages/scroll_world
          EOF
          (cd packages/scroll_world && flutter pub get)
          (cd example && flutter pub get)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            cd example && flutter test integration_test -d emulator-5554
