name: padlo_poc
description: Slovenian Padlo interactive positioning-coach proof of concept.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_scene: 0.20.0
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  shared_preferences_web: ^2.4.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/scene/
  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-VariableFont_wght.ttf
