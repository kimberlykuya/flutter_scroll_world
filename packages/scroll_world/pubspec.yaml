name: scroll_world
description: Scroll-synchronised video scenes, transitions, overlays, and navigation for Flutter.
version: 0.1.0
homepage: https://github.com/kimberlykuya/flutter_scroll_world
repository: https://github.com/kimberlykuya/flutter_scroll_world
issue_tracker: https://github.com/kimberlykuya/flutter_scroll_world/issues
