    sdk: flutter
  http: ^1.6.0
  video_player: ^2.11.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
